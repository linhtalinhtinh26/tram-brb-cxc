            async function uploadCaptions() {
            const statusEl = document.getElementById('status');
            statusEl.innerText = "Đang khởi tạo...";

            try {
                let count = 0;
                let batch = db.batch();
                const totalEN = newData.en ? newData.en.length : 0;
                const totalKR = newData.kr ? newData.kr.length : 0;
                const total = totalEN + totalKR;

                for (const lang of ['en', 'kr']) {
                    if (!newData[lang]) continue;
                    
                    for (const text of newData[lang]) {
                        const docRef = db.collection('captions').doc();
                        batch.set(docRef, {
                            text: text,
                            lang: lang,
                            isUsed: false
                        });
                        count++;

                        // Mỗi 400 câu đẩy 1 đợt
                        if (count % 400 === 0) {
                            statusEl.innerText = `Đang đẩy ${count}/${total} câu lên Firebase...`;
                            await batch.commit();
                            batch = db.batch();
                        }
                    }
                }
                
                // Đẩy phần còn lại
                if (count % 400 !== 0) {
                    statusEl.innerText = `Đang đẩy các câu cuối cùng (${count}/${total})...`;
                    await batch.commit();
                }

                statusEl.innerText = `Hoàn tất! Đã đẩy thành công ${count} câu lên Firebase.`;
                alert("Đã upload thành công toàn bộ dữ liệu!");
            } catch (error) {
                console.error("Lỗi khi đẩy dữ liệu:", error);
                statusEl.innerText = "LỖI: " + error.message;
                alert("Đẩy dữ liệu thất bại! Mở F12 Console để xem lỗi chi tiết.");
            }
        }
    </script>
